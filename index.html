<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaushik Kanniah S – Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7FAF7; --card:#FFFFFF; --surface:#EEF5EF; --line:#DDE8E0; --muted:#42564A; --text:#14241A;
  --green:#3F7F5B; --green-soft:#DEEDE2; --sage:#AFD2BA; --green-deep:#24503A;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.65 var(--sans)}
a{color:var(--green-deep);text-decoration-color:var(--sage);text-underline-offset:3px}
a:hover{text-decoration-color:var(--green)}
a:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
nav .wrap{display:flex;gap:22px;align-items:center;height:56px;overflow-x:auto;white-space:nowrap}
nav a{text-decoration:none;color:var(--muted);font-size:15px;font-weight:500}
nav a:hover{color:var(--green-deep)}
nav .brand{color:var(--text);font-family:var(--serif);font-size:20px;margin-right:auto}
.hero{padding:88px 0 40px}
h1{font:400 clamp(42px,8vw,70px)/1.05 var(--serif);letter-spacing:-.02em;margin:0 0 20px}
.lead{font-size:20px;color:var(--muted);max-width:34em;margin:0 0 28px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 20px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--green)}
.btn.primary{background:var(--green);color:#fff}
.btn.ghost{color:var(--green-deep)}
.btn:hover{background:var(--green-soft);color:var(--green-deep)}
.btn.primary:hover{background:var(--green-deep);color:#fff}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px max(24px,calc((100vw - 712px)/2)) 24px;scrollbar-width:thin}
.tile{flex:0 0 232px;scroll-snap-align:start;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.tile:hover{border-color:var(--green)}
.tile svg{display:block;width:100%;height:auto}
.tile span{display:block;padding:10px 14px 12px;font-weight:600;font-size:15px}
section{padding:60px 0;border-top:1px solid var(--line)}
h2{font:500 32px/1.2 var(--serif);margin:0 0 24px}
p{margin:0 0 16px;max-width:38em}
.band{background:var(--surface)}
.muted{color:var(--muted)}
.edu{display:grid;gap:4px}
.facts{display:grid;gap:10px;margin-top:28px;padding:20px 22px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.facts div{display:grid;grid-template-columns:110px 1fr;gap:12px}
.facts span:first-child{color:var(--muted)}
@media (max-width:520px){.facts div{grid-template-columns:1fr;gap:0}}
.case{padding:44px 0;border-bottom:1px solid var(--line)}
.case:last-child{border-bottom:0}
.case svg{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line);margin-bottom:22px}
.case h3{font:500 26px/1.25 var(--serif);margin:0 0 8px}
.case h4{font:600 16px/1.4 var(--sans);margin:20px 0 6px;color:var(--green-deep)}
.case ul{margin:0;padding-left:20px;max-width:38em}
.case li{margin-bottom:4px}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:14px 0 0;list-style:none}
.tags li{background:var(--green-soft);color:var(--green-deep);font-size:14px;font-weight:500;padding:3px 12px;border-radius:999px}
.more{display:grid;gap:14px}
.more div{padding:16px 0;border-top:1px solid var(--line)}
.more strong{display:block;font-weight:600}
.ach{display:grid;gap:18px}
.ach div{padding-left:16px;border-left:3px solid var(--sage)}
.ach strong{display:block;font-weight:600}
.contact{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.contact span{display:inline-block;min-width:84px;color:var(--muted)}
footer{padding:32px 0 48px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
/* svg art */
.bg{fill:var(--surface)}.cd{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.sf{fill:var(--green-soft)}.sg{fill:var(--sage)}.gr{fill:var(--green)}.dp{fill:var(--green-deep)}
.l1{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.l2{fill:none;stroke:var(--sage);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.l3{fill:none;stroke:var(--green-deep);stroke-width:2;stroke-dasharray:6 5;stroke-linecap:round}
.tx{fill:var(--text);font:600 15px var(--sans)}.tm{fill:var(--muted);font:500 13px var(--sans)}
@media (max-width:520px){.hero{padding:60px 0 28px}body{font-size:16px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

  SITE.projects.forEach(p => {
    const c = el("article", { className:"case", id:p.id });
    c.appendChild(art(p.art, p.title + " illustration"));
    c.appendChild(el("h3", { textContent:p.title }));
    c.appendChild(el("p", { textContent:p.summary }));
    c.appendChild(el("h4", { textContent:"Key results" }));
    const ul = el("ul"); p.results.forEach(r => ul.appendChild(el("li", { textContent:r }))); c.appendChild(ul);
    c.appendChild(el("h4", { textContent:"Outcome" })); c.appendChild(el("p", { textContent:p.outcome }));
    c.appendChild(el("h4", { textContent:"What I learned" })); c.appendChild(el("p", { textContent:p.lessons }));
    if (p.links.length) { const lp = el("p"); p.links.forEach(([t,h],i) => { if(i) lp.appendChild(document.createTextNode("  ")); lp.appendChild(el("a", { href:h, target:"_blank", rel:"noopener", textContent:t })); }); c.appendChild(lp); }
    const tg = el("ul", { className:"tags" }); p.tags.forEach(t => tg.appendChild(el("li", { textContent:t }))); c.appendChild(tg);
    $("projBox").appendChild(c);
  });

  SITE.achievements.forEach(a => { const d = el("div"); d.appendChild(el("strong", { textContent:a.title })); d.appendChild(el("span", { className:"muted", textContent:a.text })); $("achBox").appendChild(d); });
  SITE.skills.forEach(s => $("skillBox").appendChild(el("li", { textContent:s })));
  SITE.contact.forEach(c => { const li = el("li"); li.appendChild(el("span", { textContent:c.label })); li.appendChild(el("a", { href:c.href, target:c.href.startsWith("mailto:")?"_self":"_blank", rel:"noopener", textContent:c.value })); $("contactBox").appendChild(li); });
  $("foot").textContent = "© " + new Date().getFullYear() + " " + SITE.name;
})();
</script>
</body>
</html>
